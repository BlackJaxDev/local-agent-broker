name: CI

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x
      - name: Restore
        shell: pwsh
        run: ./Tools/Invoke-Build.ps1 -DotnetArguments @('restore', 'LocalAgentBroker.slnx')
      - name: Build
        shell: pwsh
        run: ./Tools/Invoke-Build.ps1 -DotnetArguments @('build', 'LocalAgentBroker.slnx', '--no-restore')
      - name: Test
        shell: pwsh
        run: ./Tools/Invoke-Build.ps1 -DotnetArguments @('test', 'tests/LocalAgentBroker.Tests/LocalAgentBroker.Tests.csproj', '--no-restore')
      - name: Check MCP protocol
        shell: pwsh
        run: ./Tools/Test-Mcp.ps1 -BrokerPath ./src/LocalAgentBroker/bin/Debug/net10.0/LocalAgentBroker.dll -Workspace .
